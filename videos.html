    <style>
      .vid-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 32px}
      .vid-chip{background:transparent;color:inherit;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 16px;cursor:pointer;font:inherit;font-size:14px}
      .vid-chip.is-active,.vid-chip:hover{background:#fff;color:#111;border-color:#fff}
      .vid-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
      .vid-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;overflow:hidden;text-align:left}
      .vid-media{position:relative;aspect-ratio:16/9;background:#000}
      .vid-media iframe,.vid-media video{position:absolute;inset:0;width:100%;height:100%;border:0}
      .vid-thumb{position:absolute;inset:0;width:100%;height:100%;border:0;padding:0;cursor:pointer;background:#000 center/cover no-repeat}
      .vid-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
      .vid-thumb:hover .vid-play{transform:translate(-50%,-50%) scale(1.12)}
      .vid-body{padding:16px}
      .vid-tag{display:inline-block;font-size:12px;letter-spacing:.05em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
      .vid-title{font-size:18px;margin:0 0 6px;line-height:1.3}
      .vid-desc{font-size:14px;opacity:.75;margin:0}
    </style>
  </head>
